name: HelixScreen Documentation

on:
  push:
    branches: [ main, ui-redesign ]
    tags:
      - 'v*'  # Also trigger on version tags
    paths:
      - 'prototype-ui9/**'
      - '.github/workflows/helixscreen-doxygen.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'prototype-ui9/**'
      - '.github/workflows/helixscreen-doxygen.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype-ui9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate git metadata

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          doxygen --version

      - name: Generate Doxygen documentation
        run: |
          echo "Generating documentation with Doxygen..."
          doxygen Doxyfile

          if [ ! -d "build/docs/html" ]; then
            echo "❌ ERROR: Doxygen failed to generate HTML output"
            exit 1
          fi

          echo "✅ Documentation generated successfully"
          echo "📊 Generated files:"
          du -sh build/docs/html
          echo ""
          echo "📄 File count:"
          find build/docs/html -type f | wc -l

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: prototype-ui9/build/docs/html/
          retention-days: 30

      - name: Deploy to docs/api (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Create docs/api if it doesn't exist
          mkdir -p docs/api

          # Remove old generated content (keep .gitkeep and README.md if present)
          find docs/api -mindepth 1 ! -name '.gitkeep' ! -name 'README.md' -delete

          # Copy new generated docs
          cp -r build/docs/html/* docs/api/

          echo "✅ Documentation prepared in docs/api/"
          ls -lah docs/api/ | head -20

      - name: Commit documentation (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd ..  # Go to repo root
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add changes from prototype-ui9/docs/api
          git add prototype-ui9/docs/api/

          if git diff --staged --quiet; then
            echo "ℹ️  No documentation changes to commit"
            exit 0
          fi

          git commit -m "docs(prototype-ui9): update API documentation for ${GITHUB_REF_NAME}

Generated from tag: ${GITHUB_REF_NAME}
Commit: ${GITHUB_SHA:0:8}

Auto-generated by Doxygen workflow"

          git push origin HEAD:${GITHUB_REF_NAME%/*}/${GITHUB_REF_NAME##*/}

          echo "✅ Documentation committed"

      - name: Summary
        run: |
          echo "## 📚 Doxygen Documentation Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "- **Tag:** ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
            echo "- **Deployed to:** \`prototype-ui9/docs/api/\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Branch:** ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact uploaded** (no deployment on branch pushes)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Commit:** ${GITHUB_SHA:0:8}" >> $GITHUB_STEP_SUMMARY
